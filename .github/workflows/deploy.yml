name: skippymart

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy_skippymart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'

      - name: Install and Build Vite App
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: ${{ secrets.AUDIENCE }}
          role-duration-seconds: 7200

      - name: Run aws sts get-caller-identity
        run: |
          aws sts get-caller-identity

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform plan -lock=false -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -lock=false -auto-approve tfplan
        working-directory: terraform

      - name: Sync dist to S3 Bucket
        run: |
          aws s3 sync ./dist s3://${{ secrets.BUCKET_NAME }} --delete --region us-west-2