name: destroy skippymart

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  
jobs:
  destroy_skippymart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Run aws sts get-caller-identity
        run: |
          aws sts get-caller-identity

      - name: Force Empty S3 Bucket
        run: |
          aws s3 rm s3://${{ secrets.BUCKET_NAME }} --recursive --region us-west-2
        continue-on-error: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Destroy Plan
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform plan -destroy -lock=false -out=destroyplan
        working-directory: terraform

      - name: Terraform Apply Destroy
        run: terraform apply -lock=false -auto-approve destroyplan
        working-directory: terraform